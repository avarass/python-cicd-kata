name: Deployment
run-name: ${{ github.actor }} is running Deployment  🚀
on:
  push:
    branches:
      - main

jobs:

  push-to-registry:
    needs: [unit-tests, check-type-safety, check-formatter, check-linter ]
    runs-on: ubuntu-latest
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ${{ vars.DOCKERHUB_USERNAME }}/taller_cicd:latest


  deploy:
    needs: push-to-registry
    runs-on: ubuntu-latest
    steps:
      - name Deploy latest image tag in Render
        run: curl "${{ secrets.DEPLOY_WEBHOOK_URL }}$imgURL=docker.io%2F${{ vars.DOCKERHUB_USERNAME }}%2Ftaller_cicd%3Alatest"
